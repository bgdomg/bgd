<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eric Dinu 2018</title>
<link rel="icon" type="image/jpeg" href="icon.png">
<link rel="apple-touch-icon image_src" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14191B;
    --bg-elev: #1D2427;
    --bg-elev-2: #232B2E;
    --linie: #2B3538;
    --text: #F1EEE6;
    --text-dim: #97A29D;
    --accent: #3FC2B0;
    --accent-inchis: #1B4640;
    --verde: #3FC2B0;
    --verde-inchis: #1B4640;
    --radius: 12px;
    --max-w: 880px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:'Karla', sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
  }
  h1,h2,.scor,.hero-echipe,.meci-data .zi{ font-family:'Oswald', sans-serif; }

  a{ color:inherit; }

  .container{
    max-width:var(--max-w);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- HEADER ---------- */
  header.antet{
    padding:22px 0 20px;
    border-bottom:1px solid var(--linie);
  }
  .antet-inner{
    display:flex;
    align-items:center;
  }
  .antet-link{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:inherit;
  }
  .emblema{
    width:52px;
    height:52px;
    flex:0 0 auto;
    border-radius:50%;
    overflow:hidden;
    background:var(--bg-elev);
    border:1px solid var(--linie);
  }
  .emblema svg, .emblema img{ width:100%; height:100%; display:block; object-fit:cover; }
  .antet-text h1{
    margin:0;
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .antet-text p{
    margin:2px 0 0;
    font-size:0.85rem;
    color:var(--text-dim);
  }

  /* ---------- HERO: URMATORUL MECI ---------- */
  .hero{ padding:26px 0 6px; }
  .hero-card{
    position:relative;
    overflow:hidden;
    background:var(--bg-elev);
    border:1px solid var(--linie);
    border-radius:var(--radius);
    padding:22px 22px 20px;
  }
  .hero-card::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(63,194,176,0.20) 0%, rgba(63,194,176,0) 70%);
    pointer-events:none;
  }
  .hero-eyebrow-in{
    position:relative;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:0.72rem;
    font-weight:700;
    color:var(--text-dim);
    letter-spacing:0.02em;
    margin:0 0 14px;
  }
  .hero-eyebrow-in .punct{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#E5484D;
    flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(229,72,77,0.22);
    animation:clipeste 1.4s ease-in-out infinite;
  }
  @keyframes clipeste{
    0%, 100% { opacity:1; }
    50% { opacity:0.25; }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-eyebrow-in .punct{ animation:none; }
  }
  .hero-etapa{
    position:relative;
    font-size:0.82rem;
    color:var(--accent);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .hero-echipe{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:flex-start;
    flex-wrap:nowrap;
    gap:8px;
    margin-left:-1px;
    font-size:clamp(0.98rem, 4.6vw, 1.55rem);
    font-weight:600;
  }
  .hero-echipe .nume-echipa{
    flex:0 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hero-echipe .nume-echipa.eric{
    flex:0 0 auto;
    color:var(--accent);
  }
  .hero-vs{
    font-size:0.7em;
    color:var(--text-dim);
    flex:0 0 auto;
  }
  .hero-meta{
    position:relative;
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    font-size:0.86rem;
    color:var(--text-dim);
  }
  .hero-meta span{ display:flex; align-items:center; gap:6px; }

  .countdown{
    position:relative;
    display:flex;
    gap:10px;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--linie);
  }
  .countdown-seg{
    flex:1;
    text-align:center;
    background:var(--bg-elev-2);
    border:1px solid var(--linie);
    border-radius:8px;
    padding:8px 4px 7px;
  }
  .countdown-num{
    font-size:1.35rem;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .countdown-label{
    margin-top:3px;
    font-size:0.63rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .countdown-gata{
    position:relative;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--linie);
    font-size:0.88rem;
    color:var(--accent);
  }
  .fara-meciuri{
    font-size:0.95rem;
    color:var(--text-dim);
    position:relative;
  }

  /* ---------- TABURI ---------- */
  .taburi{
    display:flex;
    gap:6px;
    margin:24px 0 14px;
    background:var(--bg-elev);
    border:1px solid var(--linie);
    border-radius:999px;
    padding:4px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--text-dim);
    padding:9px 12px;
    border-radius:999px;
    font-family:'Karla', sans-serif;
    font-size:0.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .tab-btn.activ{
    background:var(--accent);
    color:#04342C;
  }

  /* ---------- FILTRE ---------- */
  .filtre-lista{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .filtru-btn{
    border:1px solid var(--linie);
    background:transparent;
    color:var(--text-dim);
    padding:6px 13px;
    border-radius:999px;
    font-family:'Karla', sans-serif;
    font-size:0.8rem;
    font-weight:700;
    cursor:pointer;
  }
  .filtru-btn.activ{
    background:var(--verde-inchis);
    border-color:var(--verde);
    color:var(--text);
  }

  /* ---------- LISTE ---------- */
  .lista-meciuri{ padding-bottom:8px; }
  .lista-meciuri.ascuns{ display:none; }

  .card-meci{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    border:1px solid var(--linie);
    border-radius:var(--radius);
    margin-bottom:9px;
    background:var(--bg-elev);
  }
  .card-meci.jucat{ background:var(--bg-elev-2); }
  .card-meci.simplu{ padding:10px 14px; gap:0; }

  .meci-data{
    flex:0 0 66px;
    text-align:center;
    border-right:1px solid var(--linie);
    padding-right:12px;
  }
  .meci-data .zi{
    font-size:1.35rem;
    font-weight:600;
    line-height:1;
    color:var(--accent);
  }
  .meci-data .luna{
    font-size:0.68rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .meci-data .ora{
    display:block;
    margin-top:4px;
    font-size:0.74rem;
    color:var(--text-dim);
  }

  .meci-corp{ flex:1; min-width:0; }
  .meci-echipe{
    font-weight:700;
    font-size:0.96rem;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .meci-echipe .eric{ color:var(--accent); }
.scor{
     font-size:1rem;
     font-weight:700;
     color:#04342C;
     background:var(--accent);
     padding:1px 9px;
     border-radius:6px;
   }
   .scor.invinsa{
     background:#E5484D;
     color:#fff;
   }
   .scor.egal{
     background:#F5C542;
     color:#1a1a1a;
   }
  .meci-sub{
    margin-top:5px;
    display:flex;
    flex-wrap:wrap;
    gap:7px 12px;
    font-size:0.78rem;
    color:var(--text-dim);
    align-items:center;
  }

  .tag{
    display:inline-block;
    font-size:0.7rem;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  .gol{
    padding:22px 16px;
    text-align:center;
    color:var(--text-dim);
    border:1px dashed var(--linie);
    border-radius:var(--radius);
    font-size:0.88rem;
  }

  /* ---------- ALTE MECIURI (pe etape, collapsible) ---------- */
  .etapa-grup{
    margin-top:18px;
    border:1px solid var(--linie);
    border-radius:var(--radius);
    background:var(--bg-elev);
    overflow:hidden;
  }
  .etapa-grup:first-child{ margin-top:0; }
  .etapa-titlu{
    font-family:'Oswald', sans-serif;
    font-size:1.05rem;
    color:var(--accent);
    margin:0;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    cursor:pointer;
    user-select:none;
    list-style:none;
  }
  .etapa-titlu::-webkit-details-marker{ display:none; }
  .etapa-titlu::before{
    content:"▸";
    font-size:0.9rem;
    color:var(--text-dim);
    transition:transform 0.18s ease;
    flex:0 0 auto;
  }
  .etapa-grup[open] .etapa-titlu::before{
    transform:rotate(90deg);
  }
  .etapa-titlu .etapa-numar{ font-weight:700; letter-spacing:0.02em; }
  .etapa-titlu .etapa-data{
    font-family:'Karla', sans-serif;
    font-size:0.78rem;
    font-weight:400;
    color:var(--text-dim);
  }
  .etapa-titlu .etapa-urm{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Karla', sans-serif;
    font-size:0.7rem;
    font-weight:700;
    color:#E5484D;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .etapa-titlu .etapa-urm .punct{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#E5484D;
    flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(229,72,77,0.22);
    animation:clipeste 1.4s ease-in-out infinite;
  }
  .etapa-grup .etapa-continut{
    padding:0 8px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  /* ---------- CLASAMENT ---------- */
  .clasament-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .clasament-tabel{
    width:100%;
    border-collapse:collapse;
    background:var(--bg-elev);
    border:1px solid var(--linie);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:0.92rem;
  }
  .clasament-tabel thead{ background:var(--bg-elev-2); }
  .clasament-tabel th, .clasament-tabel td{
    padding:10px 8px;
    text-align:center;
    border-bottom:1px solid var(--linie);
  }
  .clasament-tabel th{
    font-family:'Oswald', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.05em;
    color:var(--text-dim);
    text-transform:uppercase;
    font-weight:600;
  }
  .clasament-tabel td.echipa, .clasament-tabel th.echipa{
    text-align:left;
    font-weight:700;
    white-space:nowrap;
  }
  .clasament-tabel tbody tr:last-child td{ border-bottom:none; }
  .clasament-tabel tbody tr.leader td.puncte{ color:var(--accent); }
  .clasament-tabel tbody tr.leader td.poz{ color:var(--accent); }
  .clasament-tabel tbody tr.echipa-eric td.echipa{ color:var(--accent); }
  .clasament-tabel tbody tr.echipa-eric td.puncte{ color:var(--accent); }
  .clasament-tabel .poz{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    color:var(--text-dim);
    width:32px;
  }
  .clasament-tabel .puncte{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:1rem;
  }

  footer{
    margin-top:30px;
    padding:20px 0 34px;
    border-top:1px solid var(--linie);
    font-size:0.8rem;
    color:var(--text-dim);
  }


  /* ---------- CĂUTARE ECHIPE ---------- */
  .antet-inner{ justify-content:space-between; gap:14px; }
  .cauta{ position:relative; flex:0 1 290px; min-width:0; }
  .cauta-toggle{ display:none; }
  .cauta-camp{ position:relative; }
  .cauta-ico{
    position:absolute; left:14px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--text-dim);
    pointer-events:none;
  }
  #cauta-input{
    width:100%;
    height:42px;
    padding:0 40px 0 38px;
    background:var(--bg-elev);
    border:1px solid var(--linie);
    border-radius:999px;
    color:var(--text);
    font-family:'Karla', sans-serif;
    font-size:16px; /* previne zoom-ul automat pe iPhone */
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  #cauta-input::placeholder{ color:var(--text-dim); }
  #cauta-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(63,194,176,0.18);
  }
  .cauta-sterge{
    position:absolute; right:6px; top:50%;
    transform:translateY(-50%);
    width:30px; height:30px;
    border:none; border-radius:50%;
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cauta-sterge[hidden]{ display:none; }
  .cauta-sterge:hover{ background:var(--bg-elev-2); color:var(--text); }
  .cauta-sterge:focus-visible, .cauta-toggle:focus-visible, .cautare-inapoi:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .cauta-sugestii{
    position:absolute;
    top:calc(100% + 6px);
    left:0; right:0;
    min-width:230px;
    z-index:50;
    margin:0; padding:6px;
    list-style:none;
    background:var(--bg-elev);
    border:1px solid var(--linie);
    border-radius:var(--radius);
    box-shadow:0 14px 32px rgba(0,0,0,0.5);
    max-height:min(320px, 60vh);
    overflow-y:auto;
  }
  .cauta-sugestii[hidden]{ display:none; }
  .cauta-sugestii li{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:9px 10px;
    border-radius:8px;
    font-size:0.92rem;
    font-weight:700;
    cursor:pointer;
  }
  .cauta-sugestii li[aria-selected="true"],
  .cauta-sugestii li:hover{ background:var(--bg-elev-2); }
  .cauta-sugestii mark{ background:none; color:var(--accent); }
  .cauta-sugestii .sug-nr{
    flex:0 0 auto;
    font-size:0.74rem;
    font-weight:400;
    color:var(--text-dim);
  }
  .cauta-sugestii li.sug-gol{
    cursor:default;
    font-weight:400;
    color:var(--text-dim);
  }
  .cauta-sugestii li.sug-gol:hover{ background:none; }

  /* rezultate */
  #rezultate-cautare{ padding-top:24px; }
  #rezultate-cautare[hidden]{ display:none; }
  .cautare-cap{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
  }
  .cautare-titlu{
    margin:0;
    font-size:1.5rem;
    font-weight:600;
    line-height:1.2;
    overflow-wrap:anywhere;
  }
  .cautare-sub{ margin:2px 0 0; font-size:0.85rem; color:var(--text-dim); }
  .cautare-inapoi{
    flex:0 0 auto;
    border:1px solid var(--linie);
    background:transparent;
    color:var(--text-dim);
    padding:7px 14px;
    border-radius:999px;
    font-family:'Karla', sans-serif;
    font-size:0.8rem;
    font-weight:700;
    cursor:pointer;
  }
  .cautare-inapoi:hover{ color:var(--text); border-color:var(--text-dim); }
  .cautare-grup{
    margin:22px 0 10px;
    font-size:1rem;
    font-weight:500;
    color:var(--text-dim);
  }
  body.cautare-activa .hero,
  body.cautare-activa .taburi,
  body.cautare-activa #filtre-lista,
  body.cautare-activa .lista-meciuri{ display:none !important; }

  @media (max-width:600px){
    .cauta{ flex:0 0 auto; margin-left:auto; }
    .cauta-toggle{
      display:flex; align-items:center; justify-content:center;
      width:42px; height:42px;
      background:var(--bg-elev);
      border:1px solid var(--linie);
      border-radius:50%;
      color:var(--text);
      cursor:pointer;
    }
    .cauta-toggle svg{ width:18px; height:18px; }
    .cauta-camp{ display:none; }
    .antet-inner.cautare-deschisa .antet-link{ display:none; }
    .antet-inner.cautare-deschisa .cauta{ flex:1 1 auto; margin-left:0; }
    .antet-inner.cautare-deschisa .cauta-toggle{ display:none; }
    .antet-inner.cautare-deschisa .cauta-camp{ display:block; }
    .cautare-titlu{ font-size:1.3rem; }
  }

  @media (max-width:520px){
    .meci-data{ flex-basis:54px; padding-right:9px; }
    .card-meci{ padding:11px; gap:10px; }
    .hero-card{ padding:18px 16px 18px; }
    .countdown{ gap:6px; }
    .countdown-seg{ padding:7px 2px 6px; }
    .countdown-num{ font-size:1.15rem; }
  }
</style>
</head>
<body>

<header class="antet">
  <div class="container antet-inner">
    <!--
      EMBLEMA: fisierul "logo.jpg" trebuie incarcat in acelasi folder cu
      acest fisier HTML (langa el, nu intr-un subfolder), altfel emblema
      nu se va vedea nici in header, nici ca favicon (vezi tag-ul <link
      rel="icon"> din <head>, mai sus, care foloseste tot "logo.jpg").
    -->
    <a href="./" class="antet-link">
      <div class="emblema">
        <img src="logo.jpg" alt="Emblema Eric Dinu">
      </div>
      <div class="antet-text">
        <h1>Eric Dinu 2018</h1>
        <p>Program meciuri &amp; rezultate</p>
      </div>
    </a>

    <div class="cauta" id="cauta">
      <button type="button" class="cauta-toggle" id="cauta-toggle" aria-label="Caută echipă" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <div class="cauta-camp" role="search">
        <svg class="cauta-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cauta-input" type="text" placeholder="Caută echipă…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
               role="combobox" aria-label="Caută echipă" aria-autocomplete="list" aria-expanded="false" aria-controls="cauta-sugestii">
        <button type="button" class="cauta-sterge" id="cauta-sterge" aria-label="Șterge căutarea" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <ul class="cauta-sugestii" id="cauta-sugestii" role="listbox" aria-label="Echipe sugerate" hidden></ul>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <div id="hero-card"></div>
  </div>
</section>

<div class="container">

  <section id="rezultate-cautare" aria-live="polite" hidden></section>

  <div class="taburi">
    <button class="tab-btn" data-tab="viitoare">Meciuri viitoare</button>
    <button class="tab-btn" data-tab="rezultate">Rezultate</button>
    <button class="tab-btn" data-tab="alte">Program complet</button>
    <button class="tab-btn" data-tab="clasament">Clasament</button>

const ZILE = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const LUNI_SCURT = ["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
const LUNI_LUNG = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];

function parseData(m){
  const [an, luna, zi] = m.data.split("-").map(Number);
  const [h, min] = m.ora.split(":").map(Number);
  return new Date(an, luna - 1, zi, h, min);
}

function tagHtml(numeCompetitie){
  const c = COMPETITII[numeCompetitie] || { culoare:"#555", text:"#fff" };
  return `<span class="tag" style="background:${c.culoare};color:${c.text}">${numeCompetitie}</span>`;
}

function locatieMeci(m){
  return m.locatie ? m.locatie : LOCATIE_IMPLICITA;
}

function randCard(m){
  const d = parseData(m);
  const ziNume = ZILE[d.getDay()];
  const scorEric = m.scorEric;
  const scorAdversar = m.scorAdversar;
  
  let scorHtml = "";
  let scorClass = "";
  if(m.jucat){
    if(scorEric > scorAdversar) scorClass = "scor";
    else if(scorEric < scorAdversar) scorClass = "scor invinsa";
    else scorClass = "scor egal";
    // Display score in home-away order
    const scorGazda = m.eric === "gazda" ? scorEric : scorAdversar;
    const scorOaspete = m.eric === "gazda" ? scorAdversar : scorEric;
    scorHtml = `<span class="${scorClass}">${scorGazda} - ${scorOaspete}</span>`;
  }

  const numeGazda = m.gazda === "Eric Dinu" ? `<span class="eric">Eric Dinu</span>` : m.gazda;
  const numeOaspete = m.oaspete === "Eric Dinu" ? `<span class="eric">Eric Dinu</span>` : m.oaspete;
  const etapaTxt = m.etapa ? `Etapa ${m.etapa} · ` : "";

  return `
    <div class="card-meci ${m.jucat ? "jucat" : ""}">
      <div class="meci-data">
        <div class="zi">${String(d.getDate()).padStart(2,"0")}</div>
        <div class="luna">${LUNI_SCURT[d.getMonth()]}</div>
        <span class="ora">${m.ora}</span>
      </div>
      <div class="meci-corp">
        <div class="meci-echipe">
          <span>${numeGazda} – ${numeOaspete}</span>
          ${scorHtml}
        </div>
        <div class="meci-sub">
          <span>${etapaTxt}${ziNume}</span>
          <span>${locatieMeci(m)}</span>
          ${tagHtml(m.competitie)}
        </div>
      </div>
    </div>
  `;
}

let numaratoareInterval = null;

function pornesteNumaratoare(dataTinta){
  clearInterval(numaratoareInterval);
  const DURATA_MECI_MS = 40 * 60 * 1000;

  function actualizeaza(){
    const cont = document.getElementById("hero-countdown");
    if(!cont){ clearInterval(numaratoareInterval); return; }

    let diferenta = dataTinta - new Date();
    if(diferenta <= 0){
      const timpTrecut = Math.abs(diferenta);
      if(timpTrecut >= DURATA_MECI_MS){
        randTot();
        return;
      }
      cont.innerHTML = `<div class="countdown-gata">🟢 Meciul e în desfășurare acum</div>`;
      return;
    }

    const zile = Math.floor(diferenta / 86400000); diferenta -= zile * 86400000;
    const ore = Math.floor(diferenta / 3600000); diferenta -= ore * 3600000;
    const minute = Math.floor(diferenta / 60000); diferenta -= minute * 60000;
    const secunde = Math.floor(diferenta / 1000);

    cont.innerHTML = `
      <div class="countdown">
        <div class="countdown-seg"><div class="countdown-num">${zile}</div><div class="countdown-label">zile</div></div>
        <div class="countdown-seg"><div class="countdown-num">${String(ore).padStart(2,"0")}</div><div class="countdown-label">ore</div></div>
        <div class="countdown-seg"><div class="countdown-num">${String(minute).padStart(2,"0")}</div><div class="countdown-label">min</div></div>
        <div class="countdown-seg"><div class="countdown-num">${String(secunde).padStart(2,"0")}</div><div class="countdown-label">sec</div></div>
      </div>
    `;
  }

  actualizeaza();
  numaratoareInterval = setInterval(actualizeaza, 1000);
}

function calculeazaClasament(){
  const clasament = {};
  ECHIPE_CLASAMENT.forEach(nume => {
    clasament[nume] = { echipa:nume, mj:0, v:0, e:0, i:0, p:0 };
  });

  ALTE_MECIURI.forEach(m => {
    if(!m.jucat) return;
    if(clasament[m.gazda] === undefined || clasament[m.oaspete] === undefined) return;

    const sg = Number(m.scorGazda);
    const so = Number(m.scorOaspete);

    clasament[m.gazda].mj += 1;
    clasament[m.oaspete].mj += 1;

    if(sg > so){
      clasament[m.gazda].v += 1;
      clasament[m.gazda].p += 3;
      clasament[m.oaspete].i += 1;
    } else if(sg < so){
      clasament[m.oaspete].v += 1;
      clasament[m.oaspete].p += 3;
      clasament[m.gazda].i += 1;
    } else {
      clasament[m.gazda].e += 1;
      clasament[m.gazda].p += 1;
      clasament[m.oaspete].e += 1;
      clasament[m.oaspete].p += 1;
    }
  });

  return Object.values(clasament).sort((a,b) => {
    if(b.p !== a.p) return b.p - a.p;
    if(b.v !== a.v) return b.v - a.v;
    return a.echipa.localeCompare(b.echipa);
  });
}

/* =========================================================================
   CĂUTARE ECHIPE (cu autocomplete)
   Cautarea foloseste DOAR lista MECIURI (meciurile lui Eric Dinu, viitoare si
   jucate). Echipele sugerate sunt Eric Dinu si adversarii din acea lista, deci
   nu trebuie modificat nimic aici cand adaugi meciuri noi.
   ALTE_MECIURI / clasamentul (tabul "Program complet") nu intra in cautare.
   ========================================================================= */
(function(){
  const norm = s => String(s).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  /* --- toate meciurile, intr-o forma unica --- */
  const TOATE = [];
  MECIURI.forEach(m => {
    const ericGazda = m.gazda === "Eric Dinu";
    TOATE.push({
      data: parseData(m), ora: m.ora, etapa: m.etapa,
      competitie: m.competitie, locatie: locatieMeci(m),
      gazda: m.gazda, oaspete: m.oaspete, jucat: !!m.jucat,
      scorG: ericGazda ? m.scorEric : m.scorAdversar,
      scorO: ericGazda ? m.scorAdversar : m.scorEric
    });
  });
  /* --- lista de echipe --- */
  const nrMeciuri = new Map();
  TOATE.forEach(m => [m.gazda, m.oaspete].forEach(n => nrMeciuri.set(n, (nrMeciuri.get(n) || 0) + 1)));
  const ECHIPE = [...nrMeciuri.keys()].map(n => ({ nume:n, norm:norm(n), nr:nrMeciuri.get(n) }));

  function potriviri(q){
    const nq = norm(q);
    if(!nq) return [];
    const tokeni = nq.split(" ");
    return ECHIPE
      .filter(e => tokeni.every(t => e.norm.includes(t)))
      .map(e => {
        let rang = 2;
        if(e.norm.startsWith(nq)) rang = 0;
        else if(tokeni.every(t => (" " + e.norm).includes(" " + t))) rang = 1;
        return { e, rang };
      })
      .sort((a,b) => a.rang - b.rang || a.e.nume.localeCompare(b.e.nume, "ro", { numeric:true }))
      .map(x => x.e);
  }

  function evidentiaza(nume, q){
    const n = norm(nume);
    if(n.length !== nume.length) return esc(nume);
    const masca = new Array(nume.length).fill(false);
    norm(q).split(" ").forEach(t => {
      if(!t) return;
      let i = n.indexOf(t);
      while(i !== -1){
        for(let k = i; k < i + t.length; k++) masca[k] = true;
        i = n.indexOf(t, i + t.length);
      }
    });
    let out = "", deschis = false;
    for(let i = 0; i < nume.length; i++){
      if(masca[i] && !deschis){ out += "<mark>"; deschis = true; }
      if(!masca[i] && deschis){ out += "</mark>"; deschis = false; }
      out += esc(nume[i]);
    }
    return deschis ? out + "</mark>" : out;
  }

  /* --- elemente --- */
  const header   = document.querySelector(".antet-inner");
  const input    = document.getElementById("cauta-input");
  const lista    = document.getElementById("cauta-sugestii");
  const btnSterge= document.getElementById("cauta-sterge");
  const btnToggle= document.getElementById("cauta-toggle");
  const zonaRez  = document.getElementById("rezultate-cautare");
  const mobil    = window.matchMedia("(max-width:600px)");

  let curente = [];
  let activ = -1;

  /* --- sugestii --- */
  function inchideSugestii(){
    lista.hidden = true;
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
    activ = -1;
  }

  function arataSugestii(){
    const q = input.value;
    curente = potriviri(q);
    activ = -1;
    input.removeAttribute("aria-activedescendant");
    if(!norm(q)){ inchideSugestii(); return; }
    lista.innerHTML = curente.length
      ? curente.map((e, i) => `
          <li role="option" id="sug-${i}" data-i="${i}" aria-selected="false">
            <span>${evidentiaza(e.nume, q)}</span>
            <span class="sug-nr">${e.nr} ${e.nr === 1 ? "meci" : "meciuri"}</span>
          </li>`).join("")
      : `<li class="sug-gol" role="presentation">Nu am găsit nicio echipă.</li>`;
    lista.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }

  function seteazaActiv(i){
    const items = lista.querySelectorAll("li[role=option]");
    if(!items.length) return;
    activ = (i + items.length) % items.length;
    items.forEach((li, k) => li.setAttribute("aria-selected", k === activ ? "true" : "false"));
    input.setAttribute("aria-activedescendant", items[activ].id);
    items[activ].scrollIntoView({ block:"nearest" });
  }

  /* --- rezultate --- */
  function cardCautare(m, echipa){
    const d = m.data;
    const evid = echipa || "Eric Dinu";
    const nume = n => n === evid ? `<span class="eric">${esc(n)}</span>` : esc(n);

    let scorHtml = "";
    if(m.jucat){
      let pers = null;
      if(echipa && (m.gazda === echipa || m.oaspete === echipa)) pers = echipa;
      else if(m.gazda === "Eric Dinu" || m.oaspete === "Eric Dinu") pers = "Eric Dinu";
      let cls = "scor";
      if(pers){
        const sP = pers === m.gazda ? m.scorG : m.scorO;
        const sA = pers === m.gazda ? m.scorO : m.scorG;
        cls = sP > sA ? "scor" : sP < sA ? "scor invinsa" : "scor egal";
      }
      scorHtml = `<span class="${cls}">${m.scorG} - ${m.scorO}</span>`;
    }

    const etapaTxt = m.etapa ? `Etapa ${m.etapa} · ` : "";
    return `
      <div class="card-meci ${m.jucat ? "jucat" : ""}">
        <div class="meci-data">
          <div class="zi">${String(d.getDate()).padStart(2,"0")}</div>
          <div class="luna">${LUNI_SCURT[d.getMonth()]}</div>
          ${m.ora ? `<span class="ora">${m.ora}</span>` : ""}
        </div>
        <div class="meci-corp">
          <div class="meci-echipe">
            <span>${nume(m.gazda)} – ${nume(m.oaspete)}</span>
            ${scorHtml}
          </div>
          <div class="meci-sub">
            <span>${etapaTxt}${ZILE[d.getDay()]}</span>
            <span>${esc(m.locatie)}</span>
            ${tagHtml(m.competitie)}
          </div>
        </div>
      </div>`;
  }

  function afiseazaRezultate(echipa, q){
    const set = echipa ? new Set([echipa]) : new Set(potriviri(q).map(e => e.nume));
    const gasite = TOATE.filter(m => set.has(m.gazda) || set.has(m.oaspete));

    const urmatoare = gasite.filter(m => !m.jucat).sort((a,b) => a.data - b.data);
    const jucate    = gasite.filter(m => m.jucat).sort((a,b) => b.data - a.data);

    const grup = (titlu, arr) => arr.length
      ? `<h2 class="cautare-grup">${titlu} (${arr.length})</h2>` + arr.map(m => cardCautare(m, echipa)).join("")
      : "";

    const titlu = echipa ? esc(echipa) : `„${esc(q.trim())}”`;
    const sub = gasite.length
      ? `${gasite.length} ${gasite.length === 1 ? "meci" : "meciuri"}`
      : "Niciun meci găsit";

    zonaRez.innerHTML = `
      <div class="cautare-cap">
        <div>
          <h2 class="cautare-titlu">${titlu}</h2>
          <p class="cautare-sub">${sub}</p>
        </div>
        <button type="button" class="cautare-inapoi" id="cautare-inapoi">Înapoi la program</button>
      </div>
      ${grup("Meciuri viitoare", urmatoare)}
      ${grup("Rezultate", jucate)}
      ${gasite.length ? "" : `<div class="gol">Nu există meciuri pentru această căutare.</div>`}
    `;
    document.getElementById("cautare-inapoi").addEventListener("click", iesire);
    zonaRez.hidden = false;
    document.body.classList.add("cautare-activa");
  }

  function ascundeRezultate(){
    zonaRez.hidden = true;
    zonaRez.innerHTML = "";
    document.body.classList.remove("cautare-activa");
  }

  /* --- deschidere / inchidere pe telefon --- */
  function deschideMobil(){
    header.classList.add("cautare-deschisa");
    btnToggle.setAttribute("aria-expanded", "true");
    input.focus();
  }
  function inchideMobil(){
    header.classList.remove("cautare-deschisa");
    btnToggle.setAttribute("aria-expanded", "false");
  }

  function iesire(){
    input.value = "";
    btnSterge.hidden = true;
    inchideSugestii();
    ascundeRezultate();
    if(mobil.matches) inchideMobil();
  }

  function alege(e){
    input.value = e.nume;
    btnSterge.hidden = false;
    inchideSugestii();
    afiseazaRezultate(e.nume);
    if(mobil.matches) input.blur();
  }

  function cautaLiber(){
    const q = input.value;
    if(!norm(q)) return;
    const gasite = potriviri(q);
    if(gasite.length === 1){ alege(gasite[0]); return; }
    inchideSugestii();
    afiseazaRezultate(null, q);
    if(mobil.matches) input.blur();
  }

  /* --- evenimente --- */
  input.addEventListener("input", () => {
    btnSterge.hidden = !input.value;
    if(!norm(input.value)){ ascundeRezultate(); inchideSugestii(); return; }
    arataSugestii();
  });

  input.addEventListener("focus", () => { if(norm(input.value)) arataSugestii(); });

  input.addEventListener("keydown", ev => {
    if(ev.key === "ArrowDown"){
      ev.preventDefault();
      if(lista.hidden) arataSugestii();
      seteazaActiv(activ + 1);
    } else if(ev.key === "ArrowUp"){
      ev.preventDefault();
      if(lista.hidden) arataSugestii();
      seteazaActiv(activ < 0 ? -1 : activ - 1);
    } else if(ev.key === "Enter"){
      ev.preventDefault();
      if(!lista.hidden && activ >= 0 && curente[activ]) alege(curente[activ]);
      else cautaLiber();
    } else if(ev.key === "Escape"){
      if(!lista.hidden) inchideSugestii();
      else if(input.value) iesire();
    }
  });

  lista.addEventListener("mousedown", ev => {
    ev.preventDefault(); // pastreaza focusul pe camp
    const li = ev.target.closest("li[role=option]");
    if(li) alege(curente[Number(li.dataset.i)]);
  });

  btnSterge.addEventListener("mousedown", ev => ev.preventDefault());
  btnSterge.addEventListener("click", () => {
    iesire();
    if(!mobil.matches) input.focus();
  });

  btnToggle.addEventListener("click", deschideMobil);

  input.addEventListener("blur", () => {
    setTimeout(() => {
      if(document.activeElement === input) return;
      inchideSugestii();
      if(mobil.matches && !input.value.trim()) inchideMobil();
    }, 120);
  });

  document.addEventListener("pointerdown", ev => {
    if(!ev.target.closest(".cauta")) inchideSugestii();
  });
})();
</script>

</body>
</html>
